# These files are the toolkit's own secret-detection tooling and its self-tests.
# The secret-shaped strings in them are intentional detection patterns and dummy
# fixtures (e.g. "AIzaSy Dummy...", "ghp_1234...", the public Anvil test key), not
# real credentials. Excluded from secret scanning to avoid false positives.
paths-ignore:
  - "scripts/_methodology/secret_exposure_selftest.py"
  - "scripts/_methodology/secret_patterns.py"
  - "scripts/cicd_leak_scanner.py"
  - "scripts/dapphunt/core/stack_fingerprint.py"
  - "scripts/dapphunt/hypothesis/clone_diff_selftest.py"
  - "scripts/dapphunt/wallet_test/runtime_exposure_selftest.py"
  - "scripts/js_mining.py"
  - "scripts/scan.sh"
  - "scripts/web2/frameworks/springboot.md"
  - "scripts/web2/web2_payloads_lint.py"
